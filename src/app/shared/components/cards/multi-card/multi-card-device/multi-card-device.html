@let device = multiCardDevice();

<mat-icon
  class="dashboard-icon"
  [fontIcon]="device.icon"
  appHighlightActiveDevice
  [isActive]="device.state"
/>

<span>{{ device.label }}</span>

<mat-slide-toggle
  [id]="device.label"
  [hideIcon]="true"
  [checked]="device.state"
  (change)="handleChangeDeviceState($event)"
  [aria-label]="device.label"
/>
