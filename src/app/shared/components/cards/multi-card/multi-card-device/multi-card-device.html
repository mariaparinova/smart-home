@let device = multiCardDevice();
@let isEditMode = dashboardStore.editModeEnabled();

<mat-icon
  class="dashboard-icon"
  [fontIcon]="device.icon"
  appHighlightActiveDevice
  [isActive]="!isEditMode && device.state"
  [class.disabled]="isEditMode"
/>

<span>{{ device.label }}</span>

<mat-slide-toggle
  [id]="device.id"
  [hideIcon]="true"
  [checked]="device.state"
  (change)="
    dashboardStore.toggleDevice({ cardId: cardId(), deviceId: device.id, newState: $event.checked })
  "
  [disabled]="isEditMode"
  [aria-label]="device.label"
/>
