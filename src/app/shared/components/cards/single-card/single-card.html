@let sensorData = sensor();
@let deviceData = device();
@let currentTabId = tabId();
@let card = singleCard();

@if (sensorData) {
  <app-single-card-sensor [singleCardSensor]="sensorData" />
}

@if (deviceData) {
  <app-single-card-device
    [tabId]="currentTabId"
    [cardId]="card.id"
    [singleCardDevice]="deviceData"
  />
}
