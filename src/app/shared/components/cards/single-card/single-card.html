@let sensor = sensorData();
@let device = deviceData();
@let currentTabId = tabId();
@let singleCardId = singleCardData();

@if (sensor) {
  <app-single-card-sensor [singleCardSensorData]="sensor" />
}

@if (device) {
  <app-single-card-device
    [tabId]="currentTabId"
    [cardId]="singleCardId.id"
  />
}
