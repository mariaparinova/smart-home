@let device = singleCardDevice();
@let isEditMode = dashboardStore.editModeEnabled();

<div class="content">
  <span class="title">{{ device.label }}</span>
  <h4>{{ device.state ? 'ON' : 'OFF' }}</h4>
</div>

<button
  mat-icon-button
  aria-label="icon"
  (click)="handleChangeDeviceState()"
  [disabled]="isEditMode"
>
  <mat-icon
    class="dashboard-icon"
    [fontIcon]="device.icon"
    appHighlightActiveDevice
    [isActive]="!isEditMode && device.state"
    [class.disabled]="isEditMode"
  />
</button>
