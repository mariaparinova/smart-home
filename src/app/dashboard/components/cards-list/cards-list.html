@let cards = contentForActiveTab();
@let activeTabId = tabId();

@for (card of cards; track card.id) {
  @if (card.layout === 'singleDevice') {
    <app-single-card
      [singleCard]="card"
      [tabId]="activeTabId"
    />
  } @else {
    <app-multi-card
      [multiCard]="card"
      [tabId]="activeTabId"
    />
  }
}

@if (!cards.length) {
  <p class="empty-dashboard">No cards found</p>
}
