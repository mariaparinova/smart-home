@let tabId = activeTabId();

<mat-tab-group
  (selectedTabChange)="setActiveTab($event)"
  [animationDuration]="0"
>
  @for (tab of tabs; track $index) {
    <mat-tab
      [label]="tab.title"
      [id]="tab.id"
    >
      <app-cards-list [activeTabId]="tabId" />
    </mat-tab>
  }
</mat-tab-group>
