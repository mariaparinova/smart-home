@let tab = tabData();

<app-tab-group
  [tabData]="tabs"
  (changeTabEvent)="setActiveTab($event)"
/>

<div class="cards-list">
  @if (tab) {
    @for (cardItem of tab.cards; track cardItem.id) {
      @if (cardItem.layout === 'singleDevice') {
        <app-single-card
          [singleCardData]="cardItem"
          [tabId]="tab.id"
        />
      } @else {
        <app-multi-card
          [multiCardData]="cardItem"
          [tabId]="tab.id"
        />
      }
    }
  }
</div>
