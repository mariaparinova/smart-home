<app-tab-group
  [data]="tabs"
  (changeTabEvent)="setActiveTab($event)"
/>

<div class="cards-list">
  @if (tabData()) {
    @for (cardItem of tabData().cards; track cardItem.id) {
      @if (cardItem.layout === 'singleDevice') {
        <app-single-card
          [data]="cardItem"
          [tabId]="tabData().id"
        />
      } @else {
        <app-multi-card
          [data]="cardItem"
          [tabId]="tabData().id"
        />
      }
    }
  }
</div>
