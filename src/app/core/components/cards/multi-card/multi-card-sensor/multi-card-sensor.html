@if (!isVerticalLayout()) {
  <mat-icon
    class="dashboard-icon"
    [fontIcon]="data().icon"
  />
  <span>{{ data().label }}</span>
} @else {
  <span>{{ data().label }}</span>
  <mat-icon
    class="dashboard-icon"
    [fontIcon]="data().icon"
  />
}

<span>{{ data().value | sensorValue }}</span>
