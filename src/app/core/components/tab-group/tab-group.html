@let currentTabId = activeTabId();
@let tabGroupData = tabData();

@for (tabItem of tabGroupData; track $index) {
  <div
    class="tab-item"
    [class.active]="currentTabId === tabItem.id"
    (click)="changeActiveTab(tabItem.id)"
    (keydown.enter)="changeActiveTab(tabItem.id)"
  >
    {{ tabItem.title }}
  </div>
}
