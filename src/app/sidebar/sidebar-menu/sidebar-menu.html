@let menu = dashboards();

@if (menu?.length) {
  <nav class="navigation">
    @for (menuItem of menu; track menuItem.id) {
      <a
        class="item"
        [routerLink]="['dashboard', menuItem.id]"
        routerLinkActive="active"
      >
        <mat-icon
          [fontIcon]="menuItem.icon"
          class="icon"
        />
        <span>{{ menuItem.title }}</span>
      </a>
    }
  </nav>
} @else {
  <p>No menu items</p>
}
