<nav class="navigation">
  @for (menuItem of menuItems; track $index) {
    <a
      class="item"
      routerLink="{{ menuItem.linkTo }}"
      routerLinkActive="active"
    >
      <mat-icon
        [fontIcon]="menuItem.iconName"
        class="icon"
      />
      <span>{{ menuItem.title }}</span>
    </a>
  }
</nav>
