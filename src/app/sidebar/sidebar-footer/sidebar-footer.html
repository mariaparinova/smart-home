@let userProfile = user();

@if (userProfile) {
  <div class="add-dashboard">
    <button
      mat-icon-button
      class="icon-button"
      (click)="openCreateDashboardDialog()"
    >
      <mat-icon>add</mat-icon>
    </button>
    <span>Add Dashboard</span>
  </div>
  <div class="log-out">
    <button
      mat-icon-button
      class="icon-button"
      (click)="logout()"
    >
      <mat-icon>exit_to_app</mat-icon>
    </button>
    <span>Log out</span>
  </div>
  <div class="user-details">
    <div class="user-initials">{{ userProfile.initials }}</div>
    <div class="user-full-name">{{ userProfile.fullName }}</div>
  </div>
} @else {
  <img
    ngSrc="/rss-logo.svg"
    alt="RSS logo"
    height="24"
    width="24"
  />
  <p class="course">RS School. Angular</p>
}
